[project]
name = "pymusas"
version = "0.4.2"
description = "PYthon Multilingual Ucrel Semantic Analysis System"
authors = [
    { name = "UCREL Research Centre", email = "ucrel@lancaster.ac.uk" },
]
license = "Apache-2.0"
license-files = [
    "LICENSE",
]
keywords = [
    "usas",
    "USAS",
    "UCREL",
    "ucrel",
    "semantics",
]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
requires-python = ">=3.10, <3.15"
dependencies = [
    "requests>=2.13.0,<3.0",
    "spacy>=3.8.13 ; python_version >= \"3.14\"",
    "spacy>=3.1.4 ; python_version < \"3.14\"",
    "srsly>=2.4.1,<3.0",
    "tqdm>=4.50.0,<5.0",
    "typer>=0.3.0,<1.0.0",
    "click>=8.2.1",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.optional-dependencies]
neural = [
    "torch>=2.2,<3.0",
    "transformers>=4.0,<6.0",
    "wsd-torch-models>0.1.1,<1.0",
]

[project.urls]
Homepage = "https://ucrel.github.io/pymusas/"
Documentation = "https://ucrel.github.io/pymusas/api/base"
Repository = "https://github.com/UCREL/pymusas"
Issues = "https://github.com/UCREL/pymusas/issues"
Changelog = "https://github.com/UCREL/pymusas/blob/main/CHANGELOG.md"

[project.entry-points.spacy_factories]
pymusas_rule_based_tagger = "pymusas.spacy_api.taggers.rule_based:RuleBasedTagger"
pymusas_neural_tagger = "pymusas.spacy_api.taggers.neural:NeuralTagger"
pymusas_hybrid_tagger = "pymusas.spacy_api.taggers.hybrid:HybridTagger"

[dependency-groups]
dev = [
    "coverage[toml]>=6.0.0",
    "datasets>=4.4.2",
    "psutil>=7.2.1",
    "pytest>=6.0,!=7.1.0,!=8.1.0,<9.0.2",
    "responses>=0.25.7",
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "types-psutil>=7.2.1.20251231",
    "types-requests>=2.32.4.20250913",
    "tomlkit>=0.15.1",
]

[build-system]
requires = [
    "uv_build>=0.9.6,<0.12.0",
]
build-backend = "uv_build"

[tool.uv]
default-groups = "all"
index = [
    { name = "pytorch", url = "https://download.pytorch.org/whl/cpu", explicit = true },
]

[tool.uv.sources.torch]
index = "pytorch"

[tool.uv.build-backend]
module-name = "pymusas"
module-root = ""

[tool.ruff]
line-length = 119

[tool.ruff.lint]
# pycodestyle (E, W), pyflakes (F), isort (I) and missing type annotations (ANN),
# ANN replaces mypy's disallow_untyped_defs and disallow_incomplete_defs.
# UP006, UP007, UP035 and UP045 (pyupgrade) enforce built-in generics (PEP 585) and
# `X | Y` unions (PEP 604) instead of the deprecated `typing` aliases.
select = ["E", "F", "W", "I", "ANN", "UP006", "UP007", "UP035", "UP045"]
# E266, E501 and W293 are the same rules that were ignored by flake8. ANN401 allows `Any`.
ignore = ["E266", "E501", "W293", "ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["pymusas"]
known-third-party = [
    "spacy",
    "srsly",
    "tqdm",
    "requests",
    "pytest",
    "responses",
    "pydoc_markdown",
    "transformers",
    "torch",
    "wsd_torch_models",
    "tomlkit",
]
force-sort-within-sections = true
lines-after-imports = 2

[tool.ty.src]
include = [
    "tests",
    "pymusas",
    "scripts",
    "benchmarks",
]
exclude = [
    "scripts/py2md.py",
]

[tool.ty.analysis]
# Treat these modules as `Any`, as they have no type hints.
replace-imports-with-any = [
    "urllib3.**",
    "tqdm",
    "tqdm.**",
    "pydoc_markdown.**",
    "spacy.vocab",
    "srsly",
    "srsly.**",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests/unit_tests",
]

[tool.coverage.run]
branch = true
source = [
    "pymusas",
]
command_line = "-m pytest"

[tool.coverage.report]
show_missing = true

[tool.coverage.json]
output = "coverage.json"

[tool.coverage.xml]
output = "coverage.xml"
